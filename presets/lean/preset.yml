schema_version: "1.0"

preset:
  id: "lean"
  name: "Lean Workflow"
  version: "1.0.1"
  description: "Minimal core workflow commands - just the prompt, just the artifact"
  author: "github"
  repository: "https://github.com/github/spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.4.4.dev0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Lean specify - create spec.md, prototype.html, and a pending UAT baseline"
      replaces: "speckit.specify"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Lean tasks - convert the frozen feature contract into requirement-level work packages"
      replaces: "speckit.tasks"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Lean implement - execute tasks from tasks.md"
      replaces: "speckit.implement"

    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Lean constitution - create or update project constitution"
      replaces: "speckit.constitution"

tags:
  - "lean"
  - "minimal"
  - "workflow"
  - "core"
