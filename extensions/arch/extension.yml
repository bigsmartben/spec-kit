schema_version: "1.0"

extension:
  id: arch
  name: "Architecture Planning Contract"
  version: "2.0.0"
  description: "Generate or reverse a planning-focused architecture contract that guides downstream Spec Kit plans"
  author: bigsmartben
  repository: https://github.com/bigsmartben/spec-kit-arch
  homepage: https://github.com/bigsmartben/spec-kit-arch
  license: MIT

requires:
  speckit_version: ">=0.8.10.dev0"

provides:
  commands:
    - name: speckit.arch.generate
      file: commands/speckit.arch.generate.md
      description: "Generate an architecture planning contract from intended product and use-case context"
    - name: speckit.arch.reverse
      file: commands/speckit.arch.reverse.md
      description: "Reverse-generate an architecture planning contract from observable repository facts"

tags:
  - architecture
  - planning-contract
  - workflow
  - design
