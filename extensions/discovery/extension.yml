schema_version: "1.0"

extension:
  id: "discovery"
  name: "Spec Kit Discovery Extension"
  version: "0.3.0"
  description: "Validate pre-development interface feasibility by finding the key interface design from uc.md, spec.md, or arch.md, validating that design with non-persistent evidence, and producing one verified interface contract artifact."
  author: "bigsmartben"
  repository: "https://github.com/bigsmartben/spec-kit-discovery"
  license: "MIT"
  homepage: "https://github.com/bigsmartben/spec-kit-discovery"
  category: "process"
  effect: "read-write"

requires:
  speckit_version: ">=0.1.0"
  commands:
    - "speckit.specify"

provides:
  commands:
    - name: "speckit.discovery.contract"
      file: "commands/discovery.md"
      description: "Finds the key interface design from uc.md, spec.md, or arch.md, validates that design with non-persistent evidence, and produces the single artifact interface-contract.md."

tags:
  - "discovery"
  - "interface-contract"
  - "api"
  - "event"
  - "webhook"
  - "technical-validation"
  - "pre-development"
  - "validation"
