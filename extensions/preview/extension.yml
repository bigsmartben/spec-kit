schema_version: "1.0"

extension:
  id: preview
  name: "Spec Kit Preview"
  version: "1.3.0"
  description: "Generate one fidelity-specific HTML design artifact from spec.md and uc.md inputs with required low, mid, or high fidelity"
  author: bigsmartben
  repository: https://github.com/bigsmartben/spec-kit-preview
  homepage: https://github.com/bigsmartben/spec-kit-preview
  license: MIT

requires:
  speckit_version: ">=0.8.10.dev0"

provides:
  commands:
    - name: speckit.preview
      file: commands/speckit.preview.md
      description: "Generate a single fidelity-specific HTML design artifact; first argument must be low, mid, or high"

tags:
  - "preview"
  - "prototype"
  - "html"
  - "wireflow"
  - "ux"
