schema_version: "1.0"

extension:
  id: inception
  name: "SDD Inception"
  version: "2.0.0"
  description: "Guide optional product inception and redirect retired architecture inception to the Constitution stage"
  author: "bigsmartben"
  repository: "https://github.com/bigsmartben/spec-kit"
  homepage: "https://github.com/bigsmartben/spec-kit"
  license: "MIT"
  category: "process"
  effect: "read-write"

requires:
  speckit_version: ">=0.8.10.dev0"

provides:
  commands:
    - name: "speckit.inception.product"
      file: "commands/speckit.inception.product.md"
      description: "Converge product intent into inception/product UC and wireflow artifacts"
    - name: "speckit.inception.arch"
      file: "commands/speckit.inception.arch.md"
      description: "Redirect the retired architecture inception command to /speckit.constitution"

tags:
  - "inception"
  - "sdd"
  - "product"
  - "migration"
  - "workflow"
